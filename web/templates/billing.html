<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的账单 - AI量化选股系统</title>
    <link rel="stylesheet" href="/static/css/style.css?v=4">
    <style>
    .billing-wrap{padding:30px 0;min-height:calc(100vh - 100px)}
    .billing-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
    .billing-header h2{font-size:22px;color:#1f2937}
    .billing-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:30px}
    .summary-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px 20px;text-align:center}
    .summary-card .label{font-size:14px;color:#667085;margin-bottom:8px}
    .summary-card .value{font-size:36px;font-weight:700;color:#1f2937}
    .summary-card .value.primary{color:#2f80ed}
    .filter-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
    .filter-bar label{font-size:13px;color:#667085}
    .filter-btn{padding:6px 14px;border:1px solid #e5e7eb;background:#fff;border-radius:6px;font-size:13px;cursor:pointer;color:#667085;transition:.15s}
    .filter-btn:hover{border-color:#2f80ed;color:#2f80ed}
    .filter-btn.active{background:#2f80ed;color:#fff;border-color:#2f80ed}
    .stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;padding:16px;background:#f7f9fc;border-radius:10px}
    .stat-item{text-align:center}
    .stat-item .stat-label{font-size:12px;color:#9ca3af;margin-bottom:4px}
    .stat-item .stat-value{font-size:20px;font-weight:700;color:#1f2937}
    .stat-item .stat-value.cost{color:#cf3f3f}
    .stat-item .stat-value.recharge{color:#1f9d55}
    .table-wrap{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}
    .bill-table{width:100%;border-collapse:collapse;font-size:14px}
    .bill-table th{background:#f7f9fc;padding:12px 16px;text-align:left;font-weight:600;color:#667085;border-bottom:2px solid #e5e7eb;white-space:nowrap}
    .bill-table td{padding:12px 16px;border-bottom:1px solid #e5e7eb;vertical-align:middle}
    .bill-table tr:hover{background:#f0f6ff}
    .bill-table .col-type{font-weight:600;color:#1f2937}
    .bill-table .col-cost{font-weight:700;text-align:right}
    .bill-table .col-cost.cost{color:#cf3f3f}
    .bill-table .col-cost.recharge{color:#1f9d55}
    .bill-table .col-time{color:#9ca3af;font-size:13px}
    .bill-table .col-detail{color:#667085;font-size:13px}
    .empty-state{text-align:center;padding:60px 20px;color:#9ca3af;font-size:15px}
    .back-btn{padding:8px 16px;border:1px solid #e5e7eb;background:#fff;border-radius:6px;font-size:14px;cursor:pointer;color:#667085;text-decoration:none}
    .back-btn:hover{background:#f5f7fa}
    @media(max-width:768px){
      .billing-wrap{padding:20px 16px}
      .billing-summary{grid-template-columns:1fr}
      .stats-bar{grid-template-columns:repeat(2,1fr)}
      .summary-card .value{font-size:28px}
      .bill-table{font-size:12px}
      .bill-table th,.bill-table td{padding:8px 10px}
    }
    </style>
</head>
<body>
    {% include "_top_nav.html" %}

    <main class="container">
        <div class="billing-header">
            <h2>我的账单</h2>
        </div>
        <div class="billing-summary">
            <div class="summary-card">
                <div class="label">当前剩余点数</div>
                <div class="value primary" id="total-points">-</div>
            </div>
            <div class="summary-card">
                <div class="label">累计消耗</div>
                <div class="value" id="total-cost">-</div>
            </div>
            <div class="summary-card">
                <div class="label">累计充值</div>
                <div class="value" id="total-recharge">-</div>
            </div>
        </div>

        <div class="filter-bar">
            <label>时间范围：</label>
            <button class="filter-btn active" data-range="all">全部</button>
            <button class="filter-btn" data-range="today">今天</button>
            <button class="filter-btn" data-range="week">本周</button>
            <button class="filter-btn" data-range="month">本月</button>
            <button class="filter-btn" data-range="quarter">本季度</button>
        </div>

        <div class="stats-bar" id="stats-bar">
            <div class="stat-item">
                <div class="stat-label">筛选笔数</div>
                <div class="stat-value" id="stat-count">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">筛选消耗</div>
                <div class="stat-value cost" id="stat-cost">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">筛选充值</div>
                <div class="stat-value recharge" id="stat-recharge">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">日均消耗</div>
                <div class="stat-value" id="stat-avg">0</div>
            </div>
        </div>

        <div class="table-wrap">
            <table class="bill-table">
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>类型</th>
                        <th>说明</th>
                        <th>时间</th>
                        <th style="text-align:right">点数变动</th>
                    </tr>
                </thead>
                <tbody id="log-tbody">
                    <tr><td colspan="5" class="empty-state">加载中...</td></tr>
                </tbody>
            </table>
            <div id="pagination" class="pagination" style="display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 0;font-size:13px;color:#6b7280">
                <button id="pg-prev" class="filter-btn" style="padding:4px 12px">上一页</button>
                <span id="pg-info">第 1 页 / 共 1 页</span>
                <button id="pg-next" class="filter-btn" style="padding:4px 12px">下一页</button>
                <span style="margin-left:12px">每页</span>
                <input id="pg-size" type="number" value="20" min="5" max="200" style="width:50px;padding:4px 6px;border:1px solid #d1d5db;border-radius:6px;text-align:center;font-size:13px" />
                <span>行</span>
            </div>
        </div>
    </main>

    <script>
    const typeMap = { analysis: "分析任务", chat: "聊天问答", recharge: "管理员充值", deep_analysis: "深度分析" };
    let allLogs = [];
    let currentPage = 1;
    let pageSize = 20;
    let filteredLogs = [];

    function getRangeFilter(range) {
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        if (range === "all") return null;
        if (range === "today") return today;
        if (range === "week") {
            const d = new Date(today);
            d.setDate(d.getDate() - d.getDay());
            return d;
        }
        if (range === "month") return new Date(now.getFullYear(), now.getMonth(), 1);
        if (range === "quarter") {
            const q = Math.floor(now.getMonth() / 3);
            return new Date(now.getFullYear(), q * 3, 1);
        }
        return null;
    }

    function filterLogs(range) {
        const cutoff = getRangeFilter(range);
        if (!cutoff) return allLogs;
        return allLogs.filter(l => new Date(l.created_at) >= cutoff);
    }

    function renderTable(logs) {
        filteredLogs = logs;
        const totalPages = Math.max(1, Math.ceil(logs.length / pageSize));
        if (currentPage > totalPages) currentPage = totalPages;
        renderPage();
    }

    function renderPage() {
        const tbody = document.getElementById("log-tbody");
        const logs = filteredLogs;
        if (!logs.length) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-state">该时间段暂无记录</td></tr>';
            document.getElementById("pg-info").textContent = "第 0 页 / 共 0 页";
            document.getElementById("pg-prev").disabled = true;
            document.getElementById("pg-next").disabled = true;
            return;
        }
        let totalCost = 0, totalRecharge = 0;
        logs.forEach(l => {
            if (l.action_type === "recharge") totalRecharge += l.points_cost;
            else totalCost += l.points_cost;
        });
        document.getElementById("stat-count").textContent = logs.length;
        document.getElementById("stat-cost").textContent = totalCost;
        document.getElementById("stat-recharge").textContent = totalRecharge;
        const times = logs.map(l => new Date(l.created_at));
        const minTime = Math.min(...times);
        const maxTime = Math.max(...times);
        const days = Math.max(1, Math.ceil((maxTime - minTime) / 86400000) + 1);
        document.getElementById("stat-avg").textContent = (totalCost / days).toFixed(1);

        const totalPages = Math.max(1, Math.ceil(logs.length / pageSize));
        const start = (currentPage - 1) * pageSize;
        const pageLogs = logs.slice(start, start + pageSize);

        tbody.innerHTML = pageLogs.map((l, i) => {
            const t = new Date(l.created_at);
            const timeStr = t.toLocaleString("zh-CN");
            const typeName = typeMap[l.action_type] || l.action_type;
            const isRecharge = l.action_type === "recharge";
            const costClass = isRecharge ? "recharge" : "cost";
            const prefix = isRecharge ? "+" : "-";
            return `<tr>
                <td>${start + i + 1}</td>
                <td class="col-type">${typeName}</td>
                <td class="col-detail">${l.detail || "-"}</td>
                <td class="col-time">${timeStr}</td>
                <td class="col-cost ${costClass}">${prefix}${l.points_cost} 点</td>
            </tr>`;
        }).join("");

        document.getElementById("pg-info").textContent = `第 ${currentPage} 页 / 共 ${totalPages} 页`;
        document.getElementById("pg-prev").disabled = currentPage <= 1;
        document.getElementById("pg-next").disabled = currentPage >= totalPages;
    }

    document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            renderTable(filterLogs(btn.dataset.range));
        });
    });

    Promise.all([
        fetch("/api/user/info", { credentials: "include" }).then(r => r.json()),
        fetch("/api/user/usage-logs", { credentials: "include" }).then(r => r.json())
    ]).then(([userInfo, logData]) => {
        const currentPoints = userInfo.points || 0;
        document.getElementById("total-points").textContent = userInfo.points !== undefined ? userInfo.points : "-";
        allLogs = logData.logs || [];
        let totalCost = 0;
        allLogs.forEach(l => {
            if (l.action_type !== "recharge") totalCost += l.points_cost;
        });
        document.getElementById("total-cost").textContent = totalCost;
        document.getElementById("total-recharge").textContent = currentPoints + totalCost;
        renderTable(allLogs);
    }).catch(() => {
        document.getElementById("log-tbody").innerHTML = '<tr><td colspan="5" class="empty-state">加载失败</td></tr>';
    });
    document.getElementById("pg-prev").addEventListener("click", () => { if (currentPage > 1) { currentPage--; renderPage(); } });
    document.getElementById("pg-next").addEventListener("click", () => { const tp = Math.max(1, Math.ceil(filteredLogs.length / pageSize)); if (currentPage < tp) { currentPage++; renderPage(); } });
    document.getElementById("pg-size").addEventListener("change", (e) => {
        pageSize = Math.max(5, Math.min(200, parseInt(e.target.value) || 20));
        e.target.value = pageSize;
        currentPage = 1;
        renderPage();
    });
    </script>
</body>
</html>
