<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI量化选股系统 - 登录</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background: #0f1923;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: "Microsoft YaHei UI", "Segoe UI", system-ui, -apple-system, sans-serif;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .login-card {
            background: #1a2332;
            border-radius: 12px;
            padding: 40px 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .login-title {
            text-align: center;
            margin-bottom: 8px;
        }
        .login-title .brand-icon {
            background: #2f80ed;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            padding: 4px 12px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 12px;
        }
        .login-title h1 {
            color: #e5e7eb;
            font-size: 22px;
            font-weight: 700;
        }
        .login-subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #9ca3af;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #0f1923;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #e5e7eb;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-group input:focus {
            border-color: #2f80ed;
            box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.15);
        }
        .form-group input::placeholder {
            color: #4b5563;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #2f80ed;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 8px;
        }
        .btn-login:hover {
            background: #2563d6;
        }
        .btn-login:active {
            background: #1d4ed8;
        }
        .error-message {
            background: rgba(207, 63, 63, 0.15);
            border: 1px solid rgba(207, 63, 63, 0.3);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }
        .login-footer {
            text-align: center;
            color: #6b7280;
            font-size: 12px;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-title">
                <span class="brand-icon">AI</span>
                <h1>AI量化选股系统</h1>
            </div>
            <div class="login-subtitle">用户登录</div>

            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login">登 录</button>
            </form>

            <div class="login-footer">请联系管理员获取账号</div>
        </div>
    </div>
</body>
</html>
